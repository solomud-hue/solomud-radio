name: Check radio streams

on:
  push:
    paths:
      - "scripts/check_streams.py"
      - ".github/workflows/check-radio-streams.yml"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Probe radio streams
        run: python scripts/check_streams.py
      - name: Commit updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f station-status.json
          if git diff --cached --quiet -- station-status.json; then
            echo "Stream status unchanged."
            exit 0
          fi
          git commit -m "Update radio stream health status"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site with verified station list
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site and station list
        id: deployment
        uses: actions/deploy-pages@v4
