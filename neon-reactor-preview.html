<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLOMUD — Neon Audio Reactor Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#25204c 0%,#0b1024 47%,#050713 100%);font:16px system-ui,sans-serif;color:#f7f6ff;display:grid;place-items:center;padding:20px}.shell{width:min(900px,100%);text-align:center;border:1px solid #45406a;border-radius:28px;background:#0c0c20cc;padding:clamp(16px,4vw,40px);box-shadow:0 0 90px #673cf92b}h1{margin:0;font-size:clamp(23px,5vw,43px);letter-spacing:.14em;text-shadow:0 0 22px #a25aff}.sub{color:#b6a4eb;letter-spacing:.28em;font-size:12px;margin:8px 0 24px}.visual{position:relative;width:100%;height:clamp(230px,45vw,400px);overflow:hidden;border-radius:22px;background:radial-gradient(circle,#27204e 0%,#090c1e 68%);border:1px solid #39335b}canvas{width:100%;height:100%;display:block}.center{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none}.disc{width:clamp(110px,23vw,185px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;background:radial-gradient(circle,#1a1438 15%,#070a19 66%);border:2px solid #b15dff;box-shadow:0 0 24px #9b46ff,0 0 45px #187aff55,inset 0 0 25px #813bff44}.disc strong{font-size:clamp(15px,3vw,24px);letter-spacing:.09em}.disc small{font-size:9px;letter-spacing:.28em;color:#b3b0d3}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:20px}button,.file{border:1px solid #675b9c;border-radius:12px;padding:11px 15px;background:#211b42;color:#fff;font:inherit;cursor:pointer}button:hover,.file:hover{background:#342762}.file input{display:none}.hint{font-size:13px;color:#aba6c5;line-height:1.6;margin-top:15px}audio{width:min(520px,100%);margin-top:14px}button[aria-pressed=true]{border-color:#2edcf7;box-shadow:0 0 15px #20c7f744}@media(prefers-reduced-motion:reduce){.visual{box-shadow:none}}
</style></head><body><main class="shell"><h1>SOLOMUD</h1><p class="sub">NEON AUDIO REACTOR • PREVIEW</p><div class="visual"><canvas id="visualizer" aria-label="Визуализация аудиочастот"></canvas><div class="center"><div class="disc"><strong>SOLOMUD</strong><small>WEB RADIO</small></div></div></div><div class="controls"><button id="demo" aria-pressed="true">Демо-анимация</button><label class="file">Выбрать музыку <input type="file" id="music" accept="audio/*"></label><button id="stop">Остановить</button></div><audio id="player" controls preload="none"></audio><p class="hint" id="status" role="status">Демо показывает дизайн. Выберите аудиофайл, чтобы увидеть реакцию на настоящие частоты. Файл остаётся на вашем устройстве.</p></main><script>
'use strict';
const canvas=document.getElementById('visualizer'),ctx=canvas.getContext('2d'),audio=document.getElementById('player'),demoBtn=document.getElementById('demo'),fileInput=document.getElementById('music'),status=document.getElementById('status');
let ac,analyser,source,data,objectUrl,demo=true,frame=0,last=0;
function setup(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.8;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination);data=new Uint8Array(analyser.frequencyBinCount)}
function setDemo(value){demo=value;demoBtn.setAttribute('aria-pressed',String(value))}
demoBtn.addEventListener('click',()=>{audio.pause();setDemo(true);status.textContent='Демонстрационный режим: движение не связано с музыкой.'});
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.src=objectUrl;setDemo(false);try{setup();await ac.resume();await audio.play();status.textContent='Реальный спектр: '+f.name}catch(e){status.textContent='Нажмите Play в аудиоплеере для запуска.'}});
audio.addEventListener('play',async()=>{try{setup();await ac.resume();setDemo(false)}catch(e){status.textContent='Не удалось запустить анализ аудио.'}});
document.getElementById('stop').addEventListener('click',()=>{audio.pause();audio.currentTime=0;setDemo(false);status.textContent='Воспроизведение остановлено.'});
function draw(t){requestAnimationFrame(draw);if(document.hidden||t-last<33)return;last=t;const dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const active=!demo&&!audio.paused&&analyser;if(active)analyser.getByteFrequencyData(data);const cx=w/2,cy=h/2,r=Math.min(w,h)*.265,n=100;frame+=.045;let bass=0;for(let i=0;i<n;i++){let v;if(active){const k=Math.floor(Math.pow(i/(n-1),1.7)*(data.length*.75));v=data[k]/255}else if(demo){v=.18+.65*Math.abs(Math.sin(frame*1.3+i*.31)*Math.cos(frame*.5+i*.13))}else v=.025;if(i<10)bass+=v;const angle=i/n*Math.PI*2-Math.PI/2,len=5+v*Math.min(65,h*.18);const x1=cx+Math.cos(angle)*(r+7),y1=cy+Math.sin(angle)*(r+7),x2=cx+Math.cos(angle)*(r+7+len),y2=cy+Math.sin(angle)*(r+7+len);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='hsl('+(195+i/n*115)+',100%,'+(55+v*25)+'%)';ctx.lineWidth=Math.max(2,w/300);ctx.shadowBlur=10+v*16;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()}ctx.shadowBlur=0;const pulse=bass/10;ctx.beginPath();ctx.arc(cx,cy,r+2+pulse*6,0,Math.PI*2);ctx.strokeStyle='rgba(173,83,255,'+(.35+pulse*.55)+')';ctx.lineWidth=2+pulse*4;ctx.stroke();const bars=48,bw=w/bars;for(let i=0;i<bars;i++){const v=active?data[Math.floor(i/bars*data.length*.65)]/255:demo?.08+.65*Math.abs(Math.sin(frame+i*.45)*Math.cos(frame*.4+i*.17)):.01;const bh=v*h*.23;ctx.fillStyle='hsla('+(195+i/bars*120)+',100%,65%,.8)';ctx.fillRect(i*bw+1,h-bh-3,Math.max(1,bw-3),bh)}}
requestAnimationFrame(draw);
window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);if(ac)ac.close()});
</script></body></html>
