plugins {
    id 'com.android.application'
}

android {
    namespace 'md.solomud.radio'
    compileSdk 35

    defaultConfig {
        applicationId 'md.solomud.radio'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
